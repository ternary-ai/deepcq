name: Release

# On every push to main: if the version in pyproject.toml is not yet on PyPI,
# test, build, publish it to PyPI (trusted publishing) and tag + release it on GitHub.
# If the version is already on PyPI the release is skipped, loudly (notice + job summary).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.pypi.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read and cross-check version
        id: version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          init_version=$(python -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('deepcq/__init__.py').read()).group(1))")
          if [ "$version" != "$init_version" ]; then
            echo "::error::Version mismatch: pyproject.toml=$version, deepcq/__init__.py=$init_version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Check PyPI and existing tag
        id: pypi
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/deepcq/$VERSION/json")
          case "$status" in
            200)
              echo "::notice::deepcq $VERSION is already on PyPI - release SKIPPED. Bump the version to publish."
              echo "### Release skipped: deepcq $VERSION already on PyPI" >> "$GITHUB_STEP_SUMMARY"
              echo "release=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "deepcq $VERSION not on PyPI - will release."
              echo "release=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unexpected HTTP $status from PyPI; refusing to guess."
              exit 1
              ;;
          esac
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tagged=$(git rev-list -n 1 "$tag")
            if [ "$tagged" != "$GITHUB_SHA" ] && [ "$status" = "404" ]; then
              echo "::error::Tag $tag already exists on $tagged, not on this commit $GITHUB_SHA."
              exit 1
            fi
          fi

  build:
    name: Test and build
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest -q

      - name: Build distributions
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
          ls dist | grep -qx "deepcq-${{ needs.check.outputs.version }}.tar.gz"
          ls dist | grep -qx "deepcq-${{ needs.check.outputs.version }}-py3-none-any.whl"

      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: [check, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/deepcq/${{ needs.check.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Tag and GitHub release
    needs: [check, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create tag
        run: |
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::notice::Tag $tag already exists on this commit - not recreating."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "deepcq $VERSION" "$GITHUB_SHA"
            git push origin "$tag"
          fi

      - name: Create GitHub release
        run: |
          gh release create "v$VERSION" dist/* \
            --title "deepcq $VERSION" \
            --notes "Published to PyPI: https://pypi.org/project/deepcq/$VERSION/" \
            --verify-tag
          echo "### Released deepcq $VERSION to PyPI and GitHub" >> "$GITHUB_STEP_SUMMARY"
